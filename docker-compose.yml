version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: binb-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - binb-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: binb-app
    ports:
      - "8138:8138"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - SITE_SECRET=${SITE_SECRET:-shhhh-very-secret}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - binb-network
    restart: unless-stopped
    # Remove volume mount in production to use built image
    # volumes:
    #   - .:/app
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Add nginx reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   container_name: binb-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - app
  #   networks:
  #     - binb-network
  #   restart: unless-stopped

volumes:
  redis_data:
    driver: local

networks:
  binb-network:
    driver: bridge