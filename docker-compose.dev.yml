version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: binb-redis-dev
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    networks:
      - binb-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: binb-app-dev
    ports:
      - "8138:8138"
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - SITE_SECRET=dev-secret-key
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - binb-dev-network
    command: sh -c "npm install && npm run minify && chmod +x /app/scripts/docker-entrypoint.sh && /app/scripts/docker-entrypoint.sh"
    restart: unless-stopped

volumes:
  redis_dev_data:
    driver: local

networks:
  binb-dev-network:
    driver: bridge